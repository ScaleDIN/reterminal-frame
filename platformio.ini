; reTerminal E1004 photo frame
; Board: XIAO ESP32-S3 core (8 MB flash, 8 MB OPI PSRAM) on the reTerminal carrier.

[env:reterminal_e1004]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv

; Updates: the version list on this repository's latest GitHub release (tools/release.py writes it).
; The repository must be public for the frame to read it. Delete the UPDATE_FEED_URL line for a build without updates.
custom_update_repo = ScaleDIN/reterminal-frame

board_build.embed_files = certs/x509_crt_bundle.bin   ; Mozilla root certificates for HTTPS

build_flags =
    -DBOARD_HAS_PSRAM
    '-DUPDATE_FEED_URL="https://github.com/${this.custom_update_repo}/releases/latest/download/releases.json"'
    -DBOARD_SCREEN_COMBO=523        ; Seeed_GFX: reTerminal E1004 (T133A01, 1200x1600, 6-colour)
    -DCORE_DEBUG_LEVEL=0

; Pinned to the Seeed_GFX commit this was written against (v2.0.3, 2026-09-04).
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
    bblanchon/ArduinoJson@^7.2.0

; Logs come out on UART1 (GPIO43/44) via the board's USB-serial bridge.
monitor_speed = 115200
