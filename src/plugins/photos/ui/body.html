<section class="tab" data-tab="photos" data-title="Photos">
<section class="card"><h2>Add photos</h2>
<div class="drop" id="phDrop"><input type="file" id="phFiles" accept="image/*" multiple hidden>
<button type="button" id="phPick">Choose photos…</button> <span class="mut">or drop them here</span></div>

<div id="phEdit" class="ph-ed" hidden>
<div class="ph-pv"><canvas id="phCv" title="Drag to choose what stays in the picture (Fill mode)"></canvas><span class="pill" id="phBusy" style="visibility:hidden">Dithering…</span></div>
<div>
<p class="ph-name" id="phName"></p>
<form class="ctl" id="phForm" onsubmit="return false">
<label title="Fill: covers the whole screen, edges cropped (drag the picture to choose the crop). Whole photo: nothing cut off, white bars.">Fit <select name="fit"><option value="cover">Fill screen (crop)</option><option value="contain">Whole photo (bars)</option></select></label>
<label title="E Ink colours are dull: a little extra colour looks natural on the panel">Colour <span class="nu"><input name="sat" type="number" min="0" max="3" step="0.05"><i class="u">×</i></span></label>
<label>Contrast <span class="nu"><input name="con" type="number" min="0.5" max="2" step="0.05"><i class="u">×</i></span></label>
<label>Brightness <span class="nu"><input name="bri" type="number" min="0.5" max="2" step="0.05"><i class="u">×</i></span></label>
<label title="Floyd–Steinberg dithering mixes the 6 inks into in-between shades; off = flat colours (posters, graphics)">Dithering <select name="dith"><option value="1">On (photos)</option><option value="0">Off (graphics)</option></select></label>
</form>
<div class="bar" style="margin-top:10px"><button type="button" id="phUp">Upload</button><button type="button" id="phAll" title="Upload this and all the remaining photos with these settings">Upload all</button><button type="button" class="d" id="phSkip">Skip</button></div>
<p class="msg" id="phMsg" aria-live="polite"></p>
</div></div>
<p class="note" style="margin:0">The preview shows what the panel will show, in its real ink colours, made for the orientation set on the Overview (<span id="phRot">portrait</span>). Photos are turned upright from their camera data.</p>
</section>

<section class="card"><div class="bar"><h2 style="margin:0">On the frame</h2><span class="sp"></span><span class="mut" id="phCount"></span></div>
<div class="ph-grid" id="phGrid"></div>
<p class="msg" id="phGMsg" aria-live="polite"></p></section>
</section>
